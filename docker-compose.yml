name: linkops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkops}
      POSTGRES_USER: ${POSTGRES_USER:-linkops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkops}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - linkops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./linkops-api
      dockerfile: Dockerfile
    image: linkops-api:local
    env_file:
      - ./linkops-api/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-linkops}
      DATABASE_USERNAME: ${POSTGRES_USER:-linkops}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-linkops}
    ports:
      - "${API_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/api/v1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    init: true
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api/v1}
      VITE_HMR_CLIENT_PORT: ${FRONTEND_PORT:-5174}
    command: ["sh", "-c", "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0"]
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - linkops_frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 240s
    init: true
    restart: unless-stopped

volumes:
  linkops_postgres_data:
  linkops_frontend_node_modules:
