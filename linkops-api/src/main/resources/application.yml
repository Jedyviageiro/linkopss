spring:
  application:
    name: linkops-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8081}

  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

linkops:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  media:
    max-file-size: 5242880
    max-images-per-service: 8
    max-image-dimension: 10000
    max-image-pixels: 40000000
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      connect-timeout: ${CLOUDINARY_CONNECT_TIMEOUT:5s}
      read-timeout: ${CLOUDINARY_READ_TIMEOUT:30s}
  security:
    password-reset:
      expiration: ${PASSWORD_RESET_EXPIRATION:30m}
      frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
      email-from: ${MAIL_FROM:no-reply@linkops.co.mz}
      mail-host: ${MAIL_HOST:}
      mail-port: ${MAIL_PORT:587}
      mail-username: ${MAIL_USERNAME:}
      mail-password: ${MAIL_PASSWORD:}
      mail-starttls: ${MAIL_STARTTLS:true}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:linkops-api}
      access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
