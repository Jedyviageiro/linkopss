spring:
  application:
    name: linkops-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
