spring:
  application:
    name: linkops-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8081}

  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

linkops:
  media:
    max-file-size: 5242880
    max-images-per-service: 8
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  security:
    jwt:
      secret: ${JWT_SECRET:linkops-development-secret-change-me-32-bytes}
      issuer: ${JWT_ISSUER:linkops-api}
      access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
