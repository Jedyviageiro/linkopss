spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/linkops}
    username: ${DATABASE_USERNAME:linkops}
    password: ${DATABASE_PASSWORD:linkops}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

linkops:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:19006,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4200,http://127.0.0.1:19006}
